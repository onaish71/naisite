name: Deploy to ECS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::399707826700:role/ticket-hub-github-actions
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t 399707826700.dkr.ecr.us-east-1.amazonaws.com/ticket-hub:latest \
            ./ticket-hub

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ticket-hub \
            --service ticket-hub \
            --force-new-deployment \
            --region us-east-1
